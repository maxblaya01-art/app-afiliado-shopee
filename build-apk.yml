name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Set up job
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verificar Flutter
        run: |
          flutter --version
          flutter doctor -v

      - name: Criar estrutura Android
        run: |
          flutter create --platforms=android .

      - name: Corrigir configuração Android
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CORRIGINDO CONFIGURAÇÃO ANDROID"
          echo "========================================"

          BUILD_FILE="android/app/build.gradle"

          if [ ! -f "$BUILD_FILE" ]; then
            echo "ERRO: android/app/build.gradle não encontrado."
            exit 1
          fi

          echo "Arquivo encontrado: $BUILD_FILE"

          echo ""
          echo "Removendo completamente shrinkResources..."

          # Remove qualquer configuração de shrinkResources
          sed -i '/shrinkResources/d' "$BUILD_FILE"

          # Desativa qualquer configuração de minify
          sed -i 's/minifyEnabled[[:space:]]*=[[:space:]]*true/minifyEnabled = false/g' "$BUILD_FILE"
          sed -i 's/minifyEnabled[[:space:]]\+true/minifyEnabled false/g' "$BUILD_FILE"

          # Remove configurações antigas de proguard que possam ativar R8
          sed -i '/proguardFiles/d' "$BUILD_FILE"

          echo ""
          echo "Verificando configuração final:"
          cat "$BUILD_FILE"

          echo ""
          echo "========================================"
          echo "CONFIGURAÇÃO ANDROID CORRIGIDA"
          echo "========================================"

      - name: Limpar projeto
        run: |
          flutter clean
          rm -rf android/.gradle
          rm -rf build

      - name: Instalar dependências
        run: |
          flutter pub get

      - name: Verificar dependências
        run: |
          flutter pub deps

      - name: Compilar APK
        run: |
          flutter build apk \
            --release \
            --no-shrink \
            --no-tree-shake-icons

      - name: Verificar APK
        run: |
          echo "========================================"
          echo "VERIFICANDO APK"
          echo "========================================"

          find build/app/outputs/flutter-apk \
            -type f \
            -name "*.apk" \
            -print

          test -f build/app/outputs/flutter-apk/app-release.apk

          echo ""
          echo "APK ENCONTRADO COM SUCESSO!"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: app-afiliado-shopee-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Finalizado
        run: |
          echo "========================================"
          echo "APK GERADO COM SUCESSO!"
          echo "========================================"
