name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    name: Gerar APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verificar Flutter
        run: |
          flutter --version
          dart --version

      - name: Criar estrutura Android
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android .
          fi

      - name: Desativar R8 e Minify
        shell: bash
        run: |
          echo "Procurando configurações Android..."

          if [ -f "android/app/build.gradle" ]; then
            echo "Encontrado android/app/build.gradle"

            sed -i \
              -e 's/minifyEnabled[[:space:]]*true/minifyEnabled false/g' \
              -e 's/shrinkResources[[:space:]]*true/shrinkResources false/g' \
              android/app/build.gradle

            echo "Configuração aplicada:"
            grep -n -E "minifyEnabled|shrinkResources" android/app/build.gradle || true
          fi

          if [ -f "android/app/build.gradle.kts" ]; then
            echo "Encontrado android/app/build.gradle.kts"

            sed -i \
              -e 's/isMinifyEnabled[[:space:]]*=[[:space:]]*true/isMinifyEnabled = false/g' \
              -e 's/isShrinkResources[[:space:]]*=[[:space:]]*true/isShrinkResources = false/g' \
              android/app/build.gradle.kts

            echo "Configuração aplicada:"
            grep -n -E "isMinifyEnabled|isShrinkResources" android/app/build.gradle.kts || true
          fi

      - name: Instalar dependências
        run: |
          flutter clean
          flutter pub get

      - name: Verificar dependências
        run: |
          flutter pub deps

      - name: Compilar APK
        run: |
          flutter build apk --release --no-shrink --no-tree-shake-icons

      - name: Verificar APK
        run: |
          echo "Procurando APK..."
          find build/app/outputs/flutter-apk -type f -name "*.apk" -ls

          test -f build/app/outputs/flutter-apk/app-release.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Finalizado
        run: |
          echo "========================================"
          echo "APK GERADO COM SUCESSO!"
          echo "========================================"
