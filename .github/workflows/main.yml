name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    name: Gerar APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verificar Flutter
        run: |
          flutter --version
          dart --version

      - name: Criar estrutura Android
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android .
          fi

      - name: Instalar dependências
        run: |
          flutter clean
          flutter pub get

      - name: Verificar dependências
        run: |
          flutter pub deps

      - name: Gerar APK
        run: |
          flutter build apk --debug --no-tree-shake-icons

      - name: Verificar APK
        run: |
          echo "APK encontrado:"
          find build/app/outputs/flutter-apk -type f -name "*.apk" -ls

          test -f build/app/outputs/flutter-apk/app-debug.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Finalizado
        run: |
          echo "========================================"
          echo "APK GERADO COM SUCESSO!"
          echo "========================================"
